# tradeflow stack: TimescaleDB, Redis, backend (engine + API), dashboard (nginx).
#
# Secrets and settings come from ./.env (copy .env.example). MODE and the live
# trading latches are deliberately NOT set here: the backend reads them from .env
# and defaults to paper mode. Never put live-trading values in this file.
#
# Every port binds to 127.0.0.1. Reach the dashboard through an SSH tunnel or a TLS
# reverse proxy (see README "Deployment"); never expose it unencrypted.

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow} -d ${POSTGRES_DB:-tradeflow}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    # The backend exits after the daily Kite session expiry (06:00 IST) and is
    # restarted here: the KiteTicker reactor can only start once per process.
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tradeflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tradeflow}
      REDIS_URL: redis://redis:6379/0
      # Must be on the volume (and writable): overrides any value in .env.
      STRATEGY_OVERRIDES_FILE: /app/state/strategies.local.yaml
    ports:
      - "127.0.0.1:8000:8000" # direct API access for the CLI / debugging only
    volumes:
      - backendstate:/app/state
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s # time to flush the order journal on shutdown

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  backendstate:
